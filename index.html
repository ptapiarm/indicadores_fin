<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Académico · Facultad de Ingeniería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* Colores institucionales */
    --bg:#ECEBE5;
    --white:#FFFFFF;
    --ink:#000000;
    --orange:#FF6F43;

    /* Tonos derivados (solo opacidades de negro/naranja, sin nuevos matices) */
    --navy:#ECEBE5;
    --navy-2:#FFFFFF;
    --navy-3:#DEDCD0;
    --paper:#FFFFFF;
    --paper-2:#ECEBE5;
    --paper-line:#DAD8CC;
    --ink-soft:rgba(0,0,0,0.6);
    --cream:#000000;
    --cream-soft:rgba(0,0,0,0.6);
    --gold:#FF6F43;
    --gold-soft:#FF6F43;

    --derecho:#FF6F43;
    --derecho-soft:#FFE3D8;
    --economia:#FF6F43;
    --economia-soft:#FFE3D8;
    --ingenieria:#FF6F43;
    --ingenieria-soft:#FFE3D8;

    --accent: var(--orange);
    --accent-soft: #FFE3D8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding: 28px 18px 60px;
  }

  .wrap{max-width:1180px;margin:0 auto;}

  /* ---------- MASTHEAD ---------- */
  .masthead{
    display:flex; align-items:center; gap:20px;
    padding: 6px 6px 26px 6px;
    color:var(--ink);
  }
  .masthead-logo{
    flex:none;
    height:52px;
    width:auto;
    display:block;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(24px, 3.4vw, 34px);
    margin:0 0 4px 0;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .masthead-sub{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.3px;
    color:var(--accent);
  }
  .masthead p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
  }
  .masthead .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:2px;
    color:var(--orange);
    font-weight:700;
    margin-bottom:6px;
    display:block;
  }

  /* ---------- FOLDER TABS ---------- */
  .tabs{
    display:flex; gap:8px;
    padding: 0 10px;
    position:relative;
    z-index:2;
  }
  .tab{
    appearance:none; border:none; cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:14px 22px 16px;
    border-radius:12px 12px 0 0;
    background:var(--navy-3);
    color:var(--ink-soft);
    display:flex; align-items:center; gap:10px;
    transform:translateY(6px);
    transition: all .22s ease;
    border-top:3px solid transparent;
  }
  .tab .dot{
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif; font-size:10px; font-weight:700;
    background:rgba(0,0,0,0.1); color:inherit;
    flex:none;
  }
  .tab:hover{ color:var(--ink); transform:translateY(2px); }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    transform:translateY(0);
    border-top:3px solid var(--accent);
    box-shadow: 0 -6px 18px rgba(0,0,0,0.10);
  }
  .tab.active .dot{ background:var(--accent); color:var(--white); }

  /* ---------- PAPER SHEET ---------- */
  .sheet{
    background:var(--paper);
    border-radius:16px;
    padding: 34px 34px 40px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    position:relative;
  }
  .sheet::after{
    content:'';
    position:absolute; left:34px; right:34px; top:0;
    height:1px; background:var(--paper-line);
    display:none;
  }

  .fac-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap:wrap; gap:18px;
    padding-bottom:22px; margin-bottom:26px;
    border-bottom:1px solid var(--paper-line);
  }
  .fac-header h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px,3vw,38px);
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .fac-header .sub{
    font-size:13.5px; color:var(--ink-soft);
    max-width:520px; line-height:1.5;
  }

  /* ---------- ESTADO ACTUAL TITLE ---------- */
  .estado-actual-title{ margin: 6px 0 18px; }
  .estado-actual-title .eyebrow-mini{
    display:block; text-transform:uppercase; letter-spacing:2.5px;
    font-size:10.5px; font-weight:700; color:var(--accent); margin-bottom:5px;
  }
  .estado-actual-title h3{
    font-family:'Fraunces', serif; font-weight:700;
    font-size:clamp(22px,2.4vw,28px); margin:0; color:var(--ink); letter-spacing:0.2px;
  }

  /* ---------- KPI ROW ---------- */
  .kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:14px;
    margin-bottom:32px;
  }
  .kpi{
    background:var(--paper-2);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:16px 16px 14px;
    position:relative;
  }
  .kpi::before{
    content:attr(data-idx);
    position:absolute; top:10px; right:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--paper-line);
  }
  .kpi .lab{
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink-soft); font-weight:600; margin-bottom:10px;
    max-width:85%;
  }
  .kpi .val{
    font-family:'Fraunces', serif;
    font-size:28px; font-weight:600; color:var(--ink);
    line-height:1;
  }
  .kpi .val span{ font-size:15px; font-weight:500; color:var(--ink-soft);}
  .kpi .delta{
    margin-top:8px; font-size:11.5px; font-family:'IBM Plex Mono',monospace;
    font-weight:600;
  }
  .kpi .delta.up{color:var(--orange);}
  .kpi .delta.down{color:var(--ink);}
  .kpi .delta.flat{color:var(--ink-soft);}
  .kpi-note{
    margin-top:8px; font-size:10.5px; color:var(--ink-soft); font-style:italic;
  }
  .kpi-breakdown{
    margin-top:10px; padding-top:8px;
    border-top:1px dashed var(--paper-line);
    max-height:104px; overflow-y:auto;
  }
  .kpi-breakdown::-webkit-scrollbar{ width:4px; }
  .kpi-breakdown::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:4px; }
  .kpi-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:2px 0;
  }
  .kpi-row .kn{
    font-family:'IBM Plex Sans',sans-serif; font-size:10px;
    color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:68%;
  }
  .kpi-row .kv{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    color:var(--ink); flex:none;
  }

  /* ---------- SECTION LABELS ---------- */
  .section-title{
    display:flex; align-items:baseline; gap:10px;
    margin: 40px 0 16px;
  }
  .section-title .n{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--accent);
    border:1px solid var(--accent);
    border-radius:20px; padding:2px 9px;
  }
  .section-title h3{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:19px; margin:0; color:var(--ink);
  }
  .section-title .line{
    flex:1; height:1px; background:var(--paper-line);
  }

  /* ---------- CHART GRID ---------- */
  .chart-grid{
    display:grid;
    grid-template-columns: 1.35fr 1fr;
    gap:18px;
  }
  .chart-grid > *{ min-width:0; }
  .chart-grid.thirds{ grid-template-columns: 1fr 1fr; }
  .chart-grid.thirds3{ grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 980px){
    .chart-grid.thirds3{ grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 820px){
    .chart-grid, .chart-grid.thirds, .chart-grid.thirds3{ grid-template-columns:1fr; }
  }

  /* ---------- SUB TABS (Pregrado / Postgrado / Educación Continua) ---------- */
  .subtabs{
    display:flex; gap:6px; flex-wrap:wrap;
    margin: 4px 0 28px;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:2px;
  }
  .subtab{
    appearance:none; border:none; cursor:pointer;
    background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600; font-size:12.5px;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    padding:9px 16px;
    border-radius:20px;
    transition: all .18s ease;
  }
  .subtab:hover{ color:var(--ink); background:var(--paper-2); }
  .subtab.active{
    background:var(--accent);
    color:var(--white);
  }

  /* ---------- CARRERA SELECTOR ---------- */
  .carrera-selector-wrap{
    margin: 2px 0 24px;
  }
  .carrera-selector-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; font-weight:700;
    color:var(--ink-soft); margin-bottom:8px; display:block;
  }
  .carrera-selector{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
    scrollbar-width: thin;
  }
  .carrera-selector::-webkit-scrollbar{ height:5px; }
  .carrera-selector::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:4px; }
  .carrera-pill{
    flex:none; appearance:none; cursor:pointer;
    padding:8px 15px; border-radius:20px;
    border:1.5px solid var(--paper-line);
    background:var(--white);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap; transition: all .15s ease;
    max-width:220px; overflow:hidden; text-overflow:ellipsis;
  }
  .carrera-pill:hover{ border-color:var(--accent); color:var(--ink); }
  .carrera-pill.active{
    background:var(--accent); border-color:var(--accent); color:var(--white);
  }

  .card{
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:18px 20px 14px;
  }
  .card h4{
    margin:0 0 2px; font-size:13.5px; font-weight:600; color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .card .note{ font-size:11px; color:var(--ink-soft); margin-bottom:10px;}
  .card canvas{ max-height:270px; }
  .card.tall canvas{ max-height:320px; }

  /* ---------- TABLE ---------- */
  .ledger-wrap{
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:12px;
    overflow-x:auto;
  }
  table.ledger{
    width:100%; border-collapse:collapse;
    font-size:12.8px;
  }
  table.ledger th{
    text-align:left;
    background:var(--paper-2);
    color:var(--ink-soft);
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.6px;
    padding:10px 12px;
    border-bottom:1px solid var(--paper-line);
    white-space:nowrap;
  }
  table.ledger td{
    padding:10px 12px;
    border-bottom:1px solid var(--paper-line);
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    white-space:nowrap;
  }
  table.ledger td.name{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    white-space:normal;
    min-width:220px;
  }
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger tr:hover td{ background:var(--accent-soft); }
  table.ledger tr.selected-row td{ background:var(--accent-soft); font-weight:600; }
  .mod-badge{
    display:inline-block; font-size:10px; font-family:'IBM Plex Sans',sans-serif;
    font-weight:600; padding:2px 7px; border-radius:20px;
    background:var(--paper-2); color:var(--ink-soft);
  }
  .mod-badge.status-active{
    background:var(--accent-soft); color:var(--accent);
  }
  table.ledger tr.row-muted td{ color:var(--ink-soft); opacity:0.6; }
  table.ledger tr.row-muted td.name{ font-weight:400; }
  .bar-cell{ display:flex; align-items:center; gap:8px; }
  .bar-track{ width:56px; height:6px; background:var(--paper-2); border-radius:4px; overflow:hidden; flex:none;}
  .bar-fill{ height:100%; background:var(--accent); }

  /* ---------- POSTGRADO ---------- */
  .empty-state{
    border:2px dashed var(--paper-line);
    border-radius:14px;
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .stampbig{
    display:inline-block;
    border:2px dashed var(--accent);
    color:var(--accent);
    border-radius:10px;
    padding:10px 22px;
    transform:rotate(-4deg);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    letter-spacing:1.5px;
    font-size:13px;
    margin-bottom:14px;
  }
  .empty-state p{ font-size:13px; max-width:420px; margin:0 auto; line-height:1.6;}

  footer{
    max-width:1180px; margin:26px auto 0;
    padding:0 10px;
    color:var(--ink-soft);
    font-size:11.5px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:640px){
    .sheet{padding:22px 16px 30px;}
    .tab{padding:11px 14px 13px; font-size:12.5px;}
    .tab span.label{display:none;}
    .fac-header{flex-direction:column;}
    .masthead-logo{height:38px;}
    .masthead{gap:12px;}
  }
</style>
</head>
<body>
<div id="passGate" style="position:fixed; inset:0; background:#ecebe5; z-index:9999; display:flex; align-items:center; justify-content:center; font-family:inherit;">
  <div style="background:#fff; border-radius:14px; padding:36px 40px; box-shadow:0 8px 30px rgba(0,0,0,0.12); width:320px; text-align:center;">
    <h2 style="margin:0 0 6px; font-size:18px;">Facultad de Ingeniería</h2>
    <div style="font-size:13px; color:#7A7768; margin-bottom:20px;">Ingresa la clave para ver el panel</div>
    <input id="passInput" type="password" placeholder="Clave de acceso" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:12px;">
    <button id="passBtn" style="width:100%; padding:10px 12px; border:none; border-radius:8px; background:#FF6F43; color:#fff; font-weight:600; font-size:14px; cursor:pointer;">Entrar</button>
    <div id="passError" style="color:#c0392b; font-size:12px; margin-top:10px; display:none;">Clave incorrecta, intenta de nuevo.</div>
  </div>
</div>
<script>
(function(){
  var PANEL_PASSWORD = "UAH_Fin2026"; // cámbiala aquí
  var gate = document.getElementById('passGate');
  var input = document.getElementById('passInput');
  var btn = document.getElementById('passBtn');
  var err = document.getElementById('passError');
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelector('.wrap').style.display = 'none';
  });
  function tryUnlock(){
    if(input.value === PANEL_PASSWORD){
      gate.style.display = 'none';
      document.querySelector('.wrap').style.display = '';
    } else {
      err.style.display = 'block';
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
})();
</script>

/* ---------------- Formatting helpers ---------------- */
function fmtInt(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return Math.round(v).toLocaleString('es-CL');
}
function fmtPct(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return (v*100).toFixed(1) + '%';
}
function fmtNum1(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toLocaleString('es-CL', {maximumFractionDigits:1});
}
function lastEntry(obj){
  if(!obj) return [null,null];
  const keys = Object.keys(obj).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return [null,null];
  const k = keys[keys.length-1];
  return [k, obj[k]];
}
function objYears(obj){
  if(!obj) return [];
  return Object.keys(obj).map(Number).sort((a,b)=>a-b);
}
/* Year-over-year change: compares the LAST available data point against the one right before it
   (not a fixed baseline year), using the exact values already extracted from the Excel. */
function yoyDeltaPct(obj){
  const years = objYears(obj);
  if(years.length<2) return null;
  const lastY = years[years.length-1], prevY = years[years.length-2];
  const lastV = obj[String(lastY)], prevV = obj[String(prevY)];
  if(prevV===null||prevV===undefined||prevV===0||lastV===null||lastV===undefined) return null;
  return { val:(lastV-prevV)/prevV*100, lastY, prevY, unit:'%' };
}
function yoyDeltaPP(obj){
  const years = objYears(obj);
  if(years.length<2) return null;
  const lastY = years[years.length-1], prevY = years[years.length-2];
  const lastV = obj[String(lastY)], prevV = obj[String(prevY)];
  if(prevV===null||prevV===undefined||lastV===null||lastV===undefined) return null;
  return { val:(lastV-prevV)*100, lastY, prevY, unit:'pp' };
}
function deltaBadge(d){
  if(!d) return '';
  const cls = d.val>=0 ? 'up' : 'down';
  const arrow = d.val>=0 ? '▲' : '▼';
  const valStr = d.unit==='pp' ? Math.abs(d.val).toFixed(1) : Math.abs(d.val).toFixed(0);
  return `<div class="delta ${cls}">${arrow} ${valStr}${d.unit==='pp'?' pp':'%'} vs ${d.prevY}</div>`;
}
function seriesFor(obj, years){
  return years.map(y => (obj && obj[String(y)]!==undefined) ? obj[String(y)] : null);
}
function sumAcrossCarreras(carreras, field, year){
  let s = 0, any=false;
  carreras.forEach(c=>{
    const v = c[field] ? c[field][String(year)] : undefined;
    if(v!==undefined && v!==null){ s+=v; any=true; }
  });
  return any ? s : null;
}
function anyDataIn(carreras, fields){
  return carreras.some(c => fields.some(f => c[f] && Object.keys(c[f]).length>0));
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function kpiBreakdown(carreras, field, year, formatter){
  // Detalle por carrera/programa dentro de las tarjetas KPI: deshabilitado a pedido —
  // las tarjetas muestran solo el valor agregado de la facultad (o de la carrera filtrada).
  return '';
}
function destroyCharts(){
  Object.values(charts).forEach(c=>c && c.destroy());
  charts = {};
}
function accentColor(fac){
  return getComputedStyle(document.documentElement).getPropertyValue(FAC_META[fac].accent).trim();
}
function shadesOf(hex, n){
  const c = hexToRgb(hex);
  const out = [];
  for(let i=0;i<n;i++){
    const t = n<=1 ? 0.15 : i/(n-1);
    const mixLight = 0.15 + t*0.55;
    out.push(mixHexWithWhite(c, mixLight));
  }
  return out;
}
/* High-contrast palette for small categorical breakdowns (e.g. JCE por jerarquía) where
   tints of a single hue are too similar to tell apart. Stays within the institutional
   palette: orange, black, white and the panel's neutral greys — just varied in lightness
   and warmth instead of all being pale tints of the same orange. */
function categoricalPalette(n){
  const base = ['#FF6F43', '#1A1A1A', '#B9B7AC', '#C2410C', '#FFD3BB', '#7A7768'];
  if(n <= base.length) return base.slice(0, n);
  const extra = shadesOf('#FF6F43', n - base.length);
  return base.concat(extra);
}
function hexToRgb(hex){
  hex = hex.replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function mixHexWithWhite(c, t){
  const r = Math.round(c.r + (255-c.r)*t);
  const g = Math.round(c.g + (255-c.g)*t);
  const b = Math.round(c.b + (255-c.b)*t);
  return `rgb(${r},${g},${b})`;
}
function shortenName(n, max){
  max = max || 26;
  return n.length > max ? n.slice(0,max-2)+'…' : n;
}
function baseFont(){
  return { family: "'IBM Plex Sans', sans-serif", size: 11 };
}
/* Chart.js generates tick values like 0.07000000000000001 due to floating point math.
   Rounding to 1 decimal before formatting removes that noise (7% instead of 7.000000000000001%). */
function fmtPctTick(v){
  const n = Math.round(v*1000)/10;
  return (Number.isInteger(n) ? n : n.toFixed(1)) + '%';
}
function axisTitle(text){
  return { display: !!text, text: text||'', font: {family: "'IBM Plex Sans', sans-serif", size:12, weight:'700'}, color:'#000000', padding:{top:8} };
}
function commonLineOpts(opts){
  opts = opts || {};
  const isPct = opts.isPct;
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{
      legend:{
        position:'bottom',
        labels:{ font:baseFont(), boxWidth:10, padding:10 },
        onClick:(e, legendItem, legend) => {
          const chart = legend.chart;
          const idx = legendItem.datasetIndex;
          const meta = chart.getDatasetMeta(idx);
          meta.hidden = meta.hidden === null ? !chart.data.datasets[idx].hidden : null;
          chart.update();
        },
        onHover: (e) => { e.native.target.style.cursor = 'pointer'; },
        onLeave: (e) => { e.native.target.style.cursor = 'default'; }
      },
      tooltip:{ titleFont:baseFont(), bodyFont:baseFont(), callbacks: isPct ? {
        label: (item) => `${item.dataset.label}: ${fmtPctTick(item.parsed.y)}`
      } : {} }
    },
    scales:{
      x:{ grid:{ display:false }, ticks:{ font:baseFont() }, title: axisTitle(opts.xTitle) },
      y:{
        grid:{ color:'rgba(0,0,0,0.08)' },
        ticks:{ font:baseFont(), callback: v => isPct ? fmtPctTick(v) : v },
        beginAtZero:true,
        title: axisTitle(opts.yTitle)
      }
    }
  };
}
function commonBarOpts(opts){
  opts = opts || {};
  const isPct = opts.isPct, stacked = opts.stacked;
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{ position:'bottom', labels:{ font:baseFont(), boxWidth:10, padding:10 } },
      tooltip:{ titleFont:baseFont(), bodyFont:baseFont(), callbacks: isPct ? {
        label: (item) => `${item.dataset.label}: ${fmtPctTick(item.parsed.y)}`
      } : {} }
    },
    scales:{
      x:{ grid:{ display:false }, ticks:{ font:baseFont() }, stacked: !!stacked, title: axisTitle(opts.xTitle) },
      y:{
        grid:{ color:'rgba(0,0,0,0.08)' },
        ticks:{ font:baseFont(), callback: v => isPct ? fmtPctTick(v) : v },
        beginAtZero:true, stacked: !!stacked,
        title: axisTitle(opts.yTitle)
      }
    }
  };
}

/* ---------------- Faculty Tabs ---------------- */
function buildTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  FAC_ORDER.forEach(fac=>{
    const meta = FAC_META[fac];
    const btn = document.createElement('button');
    btn.className = 'tab' + (fac===currentFac ? ' active':'');
    btn.innerHTML = `<span class="dot">${meta.icon}</span><span class="label">${fac}</span>`;
    btn.addEventListener('click', ()=>{
      if(currentFac===fac) return;
      currentFac = fac;
      currentSub = 'pregrado';
      currentCarrera = null;
      render();
    });
    wrap.appendChild(btn);
  });
}

/* ---------------- Sub Tabs (Pregrado / Postgrado / Educación Continua) ---------------- */
function buildSubTabs(){
  return `<div class="subtabs" id="subtabs">
    ${SUBTABS.map(s=>`<button class="subtab ${s.key===currentSub?'active':''}" data-sub="${s.key}">${s.label}</button>`).join('')}
  </div>`;
}
function wireSubTabs(){
  document.querySelectorAll('.subtab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sub = btn.getAttribute('data-sub');
      if(sub===currentSub) return;
      currentSub = sub;
      renderContent();
    });
  });
}

/* ---------------- Carrera selector (only shown when a faculty has more than 1 carrera) ---------------- */
function buildCarreraSelector(carreras){
  return `<div class="carrera-selector-wrap">
    <span class="carrera-selector-label">Ver por carrera</span>
    <div class="carrera-selector" id="carreraSelector">
      <button class="carrera-pill ${!currentCarrera?'active':''}" data-carrera="">Facultad completa</button>
      ${carreras.map(c=>`<button class="carrera-pill ${currentCarrera===c.nombre?'active':''}" data-carrera="${escapeHtml(c.nombre)}" title="${escapeHtml(c.nombre)}">${escapeHtml(c.nombre)}</button>`).join('')}
    </div>
  </div>`;
}
function wireCarreraSelector(){
  const wrap = document.getElementById('carreraSelector');
  if(!wrap) return;
  wrap.querySelectorAll('.carrera-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.getAttribute('data-carrera');
      currentCarrera = val || null;
      renderContent();
    });
  });
}

/* ---------------- Main render ---------------- */
function render(){
  document.documentElement.style.setProperty('--accent', `var(${FAC_META[currentFac].accent})`);
  document.documentElement.style.setProperty('--accent-soft', `var(${FAC_META[currentFac].soft})`);

  const fac = DATA[currentFac];
  const pg = fac.pregrado;
  const totals = pg.total_facultad;
  const [vigY] = lastEntry(totals.vigentes);

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="fac-header">
      <div>
        <h2>${currentFac}</h2>
        <div class="sub">${pg.carreras.length} ${pg.carreras.length===1?'carrera de pregrado':'carreras de pregrado'} activas · ${[...new Set(pg.carreras.map(c=>c.modalidad).filter(Boolean))].join(' · ') || 'Modalidad presencial'}</div>
      </div>
    </div>
    ${buildSubTabs()}
    <div id="subcontent"></div>
  `;
  wireSubTabs();
  renderContent();

  document.getElementById('lastFac').textContent = `Vista actual: ${currentFac} · ${SUBTABS.find(s=>s.key===currentSub).label}`;
}

function renderContent(){
  destroyCharts();
  document.querySelectorAll('.subtab').forEach(b=>b.classList.toggle('active', b.getAttribute('data-sub')===currentSub));
  const fac = DATA[currentFac];
  const zone = document.getElementById('subcontent');
  if(currentSub==='pregrado'){
    renderPregrado(zone, fac.pregrado);
  } else if(currentSub==='postgrado'){
    renderPostgradoTab(zone, fac.postgrado);
  } else if(currentSub==='educacion_continua'){
    renderEducacionContinua(zone, fac.educacion_continua);
  } else {
    renderInvestigacion(zone, fac.investigacion);
  }
  document.getElementById('lastFac').textContent = `Vista actual: ${currentFac} · ${SUBTABS.find(s=>s.key===currentSub).label}`;
}

function renderPregrado(zone, pg){
  const carreras = pg.carreras;
  const hasMultiple = carreras.length > 1;

  // If the previously selected carrera doesn't exist in this faculty, reset to "todas"
  if(currentCarrera && !carreras.find(c=>c.nombre===currentCarrera)) currentCarrera = null;
  const selected = (hasMultiple && currentCarrera) ? carreras.find(c=>c.nombre===currentCarrera) : null;
  const dataSource = selected || pg.total_facultad; // same field shape in both cases
  const scopeSuffix = selected ? ` — ${selected.nombre}` : '';
  const periodosCarreras = selected ? [selected] : carreras;

  const [vigY, vigV] = lastEntry(dataSource.vigentes);
  const [nueY, nueV] = lastEntry(dataSource.nuevos);

      <div class="card"><h4>Retención 1er año por género</h4><div class="note">% que continúan tras el primer año, por cohorte de ingreso</div><canvas id="chartGeneroRet1"></canvas></div>
      <div class="card"><h4>Retención 3er año por género</h4><div class="note">${hasGenero3er ? '% que continúan tras el tercer año, por cohorte de ingreso' : 'Sin datos disponibles'}</div>${hasGenero3er ? '<canvas id="chartGeneroRet3"></canvas>' : emptyMini('Sin cohortes con 3 años de antigüedad aún')}</div>
    </div>` : ''}

    <div class="section-title"><span class="n">04</span><h3>Titulación</h3><div class="line"></div></div>

    </div>
    ${!selected ? `<div class="card tall" style="margin-top:18px;">${hasEmpleabilidad ? '<h4>Empleabilidad (Fuente Sies)</h4><div class="note">'+escapeHtml(pg.empleabilidad.descriptor||'')+', por cohorte de egreso</div><canvas id="chartEmpleabilidad"></canvas>' : '<h4>Empleabilidad (Fuente Sies)</h4>'+emptyMini('Sin datos de empleabilidad Sies para esta Facultad')}</div>` : ''}

    ${!selected ? `
    <div class="section-title"><span class="n">05</span><h3>Planta docente y jornadas académicas</h3><div class="line"></div></div>
    <div class="chart-grid thirds3">
      <div class="card"><h4>Honorarios, planta y total</h4><div class="note">N° de docentes por tipo de contrato y año</div><canvas id="chartPlanta"></canvas></div>
      <div class="card"><h4>JCE por jerarquía</h4><div class="note">Distribución por año</div><canvas id="chartJCE"></canvas></div>
      <div class="card">${hasJCEStudent ? '<h4>Estudiantes por JCE</h4><div class="note">Matrícula vigente / Jornadas completas equivalentes</div><canvas id="chartJCEStudent"></canvas>' : '<h4>Estudiantes por JCE</h4>'+emptyMini('Sin datos disponibles')}</div>

    <div class="section-title"><span class="n">06</span><h3>Detalle por carrera</h3><div class="line"></div></div>
    <div class="ledger-wrap"><table class="ledger" id="tblCarreras"></table></div>
    <div class="note" style="margin-top:8px; font-size:11px;">* La ocupación de vacantes no considera Conducencias ni PACE. Para las carreras con Ingreso DEMRE, la tasa se calcula Matriculados Demre/Vacantes Ofrecidas. Para carreras con ingreso diferente a DEMRE, se calcula (Matriculados Ingreso Especial + Matriculados Ingreso Complementario)/Vacantes Ofrecidas.</div>
  `;

  if(hasMultiple) wireCarreraSelector();

  buildVigentesChart(carreras, selected);
  if(hasOcupacion) buildOcupacionChart(dataSource);
  if(hasVacNuevos) buildVacNuevosCompChart(dataSource);
  if(hasAltPeriods){ buildPeriodosChart(periodosCarreras); buildPeriodosTable(periodosCarreras); }
  if(hasRet1) buildRetencionGenericChart('chartRetencion1', dataSource.retencion_1er_anio, YEARS.slice(0,5), RETENCION_INSTITUCIONAL_1ER, selected);
  if(hasRet3) buildRetencionGenericChart('chartRetencion3', dataSource.retencion_3er_anio, objYears(dataSource.retencion_3er_anio), RETENCION_INSTITUCIONAL_3ER, selected);
  if(hasGenero && !selected){

    buildGeneroLineChart('chartGeneroRet1', pg.genero.retencion_1er_mujer, pg.genero.retencion_1er_hombre, objYears(pg.genero.retencion_1er_mujer), 'Cohorte de ingreso', '% de retención');
    if(hasGenero3er) buildGeneroLineChart('chartGeneroRet3', pg.genero.retencion_3er_mujer, pg.genero.retencion_3er_hombre, objYears(pg.genero.retencion_3er_mujer), 'Cohorte de ingreso', '% de retención');
  }
  if(hasTitOp) buildTitulacionChart('chartTitOportuna', dataSource.titulacion_oportuna);
  if(hasTitTot) buildTitulacionChart('chartTitTotal', dataSource.titulacion_total);
  if(!selected){
    buildPlantaChart(pg.planta_docente);

  }
  if(hasEmpleabilidad && !selected) buildEmpleabilidadChart(pg.empleabilidad);
  if(hasGratuidad) buildGratuidadChart(pg.gratuidad, selected);
  buildVigentesTotalChart(pg.total_facultad);
  buildCarrerasTable(carreras, selected);
}

function emptyMini(msg){
  return `<div style="padding:26px 10px; text-align:center; color:var(--ink-soft); font-size:12px; border:1.5px dashed var(--paper-line); border-radius:10px; margin-top:6px;">${msg}</div>`;

/* ---- Charts: matrícula / nuevos / ocupación ---- */
function buildVigentesChart(carreras, selected){
  const ctx = document.getElementById('chartVigentes');
  if(selected){
    const firstIdx = YEARS.findIndex(y => {
      const v = (selected.vigentes||{})[y];
      return v !== undefined && v !== null && v !== 0;
    });
    const yearsToPlot = firstIdx > 0 ? YEARS.slice(firstIdx) : YEARS;
    charts.vigentes = new Chart(ctx, {
      type:'line',
      data:{ labels:yearsToPlot, datasets:[{
        label: shortenName(selected.nombre),
        data: seriesFor(selected.vigentes, yearsToPlot),
        borderColor: accentColor(currentFac), backgroundColor: accentColor(currentFac)+'33',
        fill:true, tension:0.35, spanGaps:true, pointRadius:3, borderWidth:2.5,
      }] },
      options: commonLineOpts({xTitle:'Año Académico', yTitle:'Matriculados'})
    });
    return;
  }
  const top = [...carreras].sort((a,b)=>{
    const av = (a.vigentes && a.vigentes['2026']) || 0;
    const bv = (b.vigentes && b.vigentes['2026']) || 0;
    return bv-av;
  }).slice(0,6);
  const palette = shadesOf(accentColor(currentFac), Math.max(top.length,1));
  const datasets = top.map((c,i)=>({
    label: shortenName(c.nombre),
    data: seriesFor(c.vigentes, YEARS),
    borderColor: palette[i], backgroundColor: palette[i],
    tension:0.35, spanGaps:true, pointRadius:2.5, borderWidth:2,
  }));
  charts.vigentes = new Chart(ctx, { type:'line', data:{ labels:YEARS, datasets }, options: commonLineOpts({xTitle:'Año Académico', yTitle:'Matriculados'}) });
}
function buildVigentesTotalChart(totalFacultad){
  const ctx = document.getElementById('chartVigentesTotal');
  charts.vigentesTotal = new Chart(ctx, {
    type:'line',
    data:{ labels: YEARS, datasets:[{
      label: 'Total Facultad',
      data: seriesFor(totalFacultad.vigentes, YEARS),
      borderColor: accentColor(currentFac), backgroundColor: accentColor(currentFac)+'33',
      fill:true, tension:0.35, spanGaps:true, pointRadius:3, borderWidth:2.5,
    }] },
    options: commonLineOpts({xTitle:'Año Académico', yTitle:'Matriculados'})
  });
}
function buildOcupacionChart(totals){
  const ctx = document.getElementById('chartOcupacion');
  const fullSeries = seriesFor(totals.tasa_ocupacion, YEARS);
  const firstIdx = fullSeries.findIndex(v => v !== null && v !== 0);
  const yearsToPlot = firstIdx > 0 ? YEARS.slice(firstIdx) : YEARS;
  const data = firstIdx > 0 ? fullSeries.slice(firstIdx) : fullSeries;
  charts.ocupacion = new Chart(ctx, {
    type:'line',
    data:{ labels:yearsToPlot, datasets:[
      { label:'Ocupación', data, borderColor:accentColor(currentFac), backgroundColor:accentColor(currentFac)+'33', fill:true, tension:0.3, pointRadius:3, borderWidth:2.5, spanGaps:true },
      { label:'100% referencia', data:yearsToPlot.map(()=>1), borderColor:'rgba(0,0,0,0.35)', borderDash:[4,4], pointRadius:0, borderWidth:1 }
    ]},
    options: commonLineOpts({xTitle:'Cohorte', yTitle:'% de vacantes cubiertas', isPct:true})
  });
}
function buildVacNuevosCompChart(totals){
  const ctx = document.getElementById('chartVacNuevosComp');
  const vacSeries = seriesFor(totals.vacantes_1sem, YEARS);
  const nuevSeries = seriesFor(totals.nuevos_ocup, YEARS);
  const firstIdx = YEARS.findIndex((y,i) => {
    const v = vacSeries[i], n = nuevSeries[i];
    return (v !== null && v !== 0) || (n !== null && n !== 0);
  });
  const yearsToPlot = firstIdx > 0 ? YEARS.slice(firstIdx) : YEARS;
  const vacToPlot = firstIdx > 0 ? vacSeries.slice(firstIdx) : vacSeries;
  const nuevToPlot = firstIdx > 0 ? nuevSeries.slice(firstIdx) : nuevSeries;
  charts.vacNuevosComp = new Chart(ctx, {
    type:'bar',
    data:{ labels:yearsToPlot, datasets:[
      { label:'Vacantes 1er sem.', data:vacToPlot, backgroundColor:'#D9D7CC', borderRadius:4, maxBarThickness:22 },
      { label:'Nuevos matriculados', data:nuevToPlot, backgroundColor:accentColor(currentFac), borderRadius:4, maxBarThickness:22 },
    ]},
    options: commonBarOpts({xTitle:'Año', yTitle:'Estudiantes'})
  });
}

/* ---- Períodos complementarios ---- */
function buildPeriodosChart(carreras){
  const ctx = document.getElementById('chartPeriodos');
  const vacantesPorAnio = y => sumAcrossCarreras(carreras,'vac_otros_ofrecidas',y);
  const matriculadosPorAnio = y => {
    const s2 = sumAcrossCarreras(carreras,'vac_2do_sem',y);
    const t1 = sumAcrossCarreras(carreras,'vac_1er_trim',y);
    const t2 = sumAcrossCarreras(carreras,'vac_2do_trim',y);
    const t3 = sumAcrossCarreras(carreras,'vac_3er_trim',y);
    const parts = [s2,t1,t2,t3].filter(v=>v!==null);
    return parts.length ? parts.reduce((a,b)=>a+b,0) : null;
  };
  const vacSeries = YEARS.map(vacantesPorAnio);
  const matSeries = YEARS.map(matriculadosPorAnio);
  const firstIdx = YEARS.findIndex((y,i) => {
    const v = vacSeries[i], m = matSeries[i];
    return (v !== null && v !== 0) || (m !== null && m !== 0);
  });
  const yearsToPlot = firstIdx > 0 ? YEARS.slice(firstIdx) : YEARS;
  const vacToPlot = firstIdx > 0 ? vacSeries.slice(firstIdx) : vacSeries;
  const matToPlot = firstIdx > 0 ? matSeries.slice(firstIdx) : matSeries;
  charts.periodos = new Chart(ctx, {
    type:'bar',
    data:{ labels: yearsToPlot, datasets:[
      { label:'Vacantes ofrecidas', data: vacToPlot, backgroundColor: '#D9D7CC', borderRadius:4, maxBarThickness:26 },
      { label:'Matriculados', data: matToPlot, backgroundColor: accentColor(currentFac), borderRadius:4, maxBarThickness:26 },
    ]},
    options: commonBarOpts({xTitle:'Año Académico', yTitle:'Estudiantes'})
  });
}
function buildPeriodosTable(carreras){
  const tbl = document.getElementById('tblPeriodos');
  const rows = carreras.filter(c => ['vac_otros_ofrecidas','vac_2do_sem','vac_1er_trim','vac_2do_trim','vac_3er_trim'].some(f => c[f] && Object.keys(c[f]).length));

  const yearsSet = new Set();
  rows.forEach(c=>{
    ['vac_otros_ofrecidas','vac_2do_sem','vac_1er_trim','vac_2do_trim','vac_3er_trim'].forEach(f=>{
      Object.keys(c[f]||{}).forEach(y=>yearsSet.add(Number(y)));
    });
  });
  let years = Array.from(yearsSet).sort((a,b)=>a-b);
  if(years.length > 3) years = years.slice(-3); // solo los últimos 3 años con datos

  const matriculadosDeCarrera = (c, y) => {
    const parts = [c.vac_2do_sem, c.vac_1er_trim, c.vac_2do_trim, c.vac_3er_trim]
      .map(f => (f||{})[y]).filter(v => v!==undefined && v!==null);
    return parts.length ? parts.reduce((a,b)=>a+b,0) : null;
  };

  let html = `<thead><tr><th>Carrera</th><th></th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(c=>{
    html += `<tr>
      <td class="name" rowspan="2" style="vertical-align:middle;">${escapeHtml(c.nombre)}</td>
      <td><span class="mod-badge">Vacantes</span></td>
      ${years.map(y=>`<td>${fmtInt((c.vac_otros_ofrecidas||{})[y])}</td>`).join('')}
    </tr>
    <tr>
      <td><span class="mod-badge">Matriculados</span></td>
      ${years.map(y=>`<td>${fmtInt(matriculadosDeCarrera(c,y))}</td>`).join('')}
    </tr>`;
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}

function normalizeName(s){
  return String(s).toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[().]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

  ];
  if(selected){
    const match = (grat.carreras||[]).find(r => normalizeName(r.nombre)===normalizeName(selected.nombre));
    if(match){
      datasets.push({ label: shortenName(selected.nombre), data: match.valores, borderColor: accentColor(currentFac), backgroundColor: accentColor(currentFac)+'33', fill:true, tension:0.3, pointRadius:3, borderWidth:2.5 });
    }
  } else {
    datasets[0].borderColor = accentColor(currentFac);
    datasets[0].backgroundColor = accentColor(currentFac)+'33';

}

function buildCarrerasTable(carreras, selected){
  const tbl = document.getElementById('tblCarreras');
  let html = `<thead><tr>
    <th>Carrera</th><th>Modalidad</th><th>Acreditación</th>
    <th>Vigentes 2026</th><th>Nuevos 2026</th><th>Ocupación vac. 2026</th><th>Retención 1er año</th><th>Retención 3er año</th>
  </tr></thead><tbody>`;
  carreras.forEach(c=>{
    const [retY, retV] = lastEntry(c.retencion_1er_anio);
    const [ret3Y, ret3V] = lastEntry(c.retencion_3er_anio);
    const vig2026 = c.vigentes ? c.vigentes['2026'] : null;
    const nue2026 = c.nuevos ? c.nuevos['2026'] : null;
    const ocu2026 = c.tasa_ocupacion ? c.tasa_ocupacion['2026'] : null;
    const barPct = ocu2026!==null && ocu2026!==undefined ? Math.min(ocu2026*100,100) : 0;
    const isSel = selected && selected.nombre===c.nombre;
    html += `<tr class="${isSel?'selected-row':''}" data-carrera="${escapeHtml(c.nombre)}" style="cursor:pointer;">
      <td class="name">${escapeHtml(c.nombre)}</td>
      <td><span class="mod-badge">${c.modalidad || '—'}</span></td>
      <td>${c.acreditacion_anios ? c.acreditacion_anios + ' años' : '—'}</td>
      <td>${fmtInt(vig2026)}</td>
      <td>${fmtInt(nue2026)}</td>
      <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>${fmtPct(ocu2026)}</div></td>
      <td>${fmtPct(retV)} <span style="color:var(--ink-soft); font-size:10.5px;">${retY?('\''+String(retY).slice(2)):''}</span></td>
      <td>${fmtPct(ret3V)} <span style="color:var(--ink-soft); font-size:10.5px;">${ret3Y?('\''+String(ret3Y).slice(2)):''}</span></td>
    </tr>`;
  });
  html += '</tbody>';
  tbl.innerHTML = html;
  if(carreras.length>1){
    tbl.querySelectorAll('tbody tr').forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const name = tr.getAttribute('data-carrera');
        currentCarrera = (currentCarrera===name) ? null : name;
        renderContent();
      });
    });
  }
}

        ${kpiBreakdown(programas, 'admision', closedY, fmtInt)}
        ${(lastAdmY && lastAdmY!==closedY) ? `<div class="kpi-note">${lastAdmY} a la fecha: ${fmtInt(lastAdmV)}</div>` : ''}

    type:'bar',
    data:{ labels: EC_YEARS, datasets:[
      { label:'Matriculados', data: seriesFor(total.matricula, EC_YEARS), backgroundColor: accentColor(currentFac), borderRadius:4, maxBarThickness:34 }
    ] },
    options: commonBarOpts({xTitle:'Año', yTitle:'Matriculados'})
  });
}
function buildEcDistChart(programas, year){
  const ctx = document.getElementById('chartEcDist');
  const rows = programas.map(p=>({ nombre:p.nombre, v:(p.matricula && p.matricula[String(year)]) || 0 })).filter(r=>r.v>0);
  const palette = categoricalPalette(rows.length);
  charts.ecDist = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: rows.map(r=>shortenName(r.nombre)), datasets:[{ data: rows.map(r=>r.v), backgroundColor: palette, borderColor:'#fff', borderWidth:2 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ font:baseFont(), boxWidth:10, padding:8, font:{...baseFont(), size:10} } } },
      cutout:'60%'
    }
  });
}
function buildEcProgramaTable(programas, closedY){
  const tbl = document.getElementById('tblEcPrograma');
  let html = `<thead><tr><th>Programa</th><th>Estado</th>${EC_YEARS.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>`;
  programas.forEach(p=>{
    const activo = (p.matricula && p.matricula[String(closedY)] > 0);
    const badge = activo
      ? `<span class="mod-badge status-active">Con matrícula ${closedY}</span>`
      : `<span class="mod-badge">Sin matrícula ${closedY}</span>`;
    html += `<tr class="${activo ? '' : 'row-muted'}"><td class="name">${escapeHtml(p.nombre)}</td><td>${badge}</td>${EC_YEARS.map(y=>`<td>${fmtInt(p.matricula ? p.matricula[String(y)] : null)}</td>`).join('')}</tr>`;
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}

/* ================================================================
   INVESTIGACIÓN
   ================================================================ */
function renderInvestigacion(zone, inv){
  if(!inv || !inv.tipos || !inv.tipos.length){
    zone.innerHTML = `
      <div class="empty-state">
        <div class="stampbig">Sin registro</div>
        <p>La Facultad de ${currentFac} no cuenta con datos de investigación en el expediente consolidado.</p>
      </div>`;
    return;
  }

  const tipos = inv.tipos;
  const INV_YEARS = objYears(inv.total);
  const closedY = Math.max(...INV_YEARS);
  const prevY = closedY - 1;
  const grandTotal = INV_YEARS.reduce((s,y)=>s+(inv.total[String(y)]||0), 0);

  const tipoTotal = t => Object.values(t.valores).reduce((s,v)=>s+v, 0);
  const top = [...tipos].sort((a,b)=>tipoTotal(b)-tipoTotal(a))[0];

  const vig = inv.vigentes;
  const hasVig = !!(vig && vig.tipos && vig.tipos.length);
  const VIG_YEARS = hasVig ? objYears(vig.total) : [];
  const closedYVig = hasVig ? Math.max(...VIG_YEARS) : null;
  const prevYVig = closedYVig - 1;

  zone.innerHTML = `
    <div class="estado-actual-title">
      <span class="eyebrow-mini">Resumen ejecutivo</span>
      <h3>Estado Actual</h3>
    </div>
    <div class="kpis" style="margin-bottom:22px;">
      <div class="kpi" data-idx="inv1"><div class="lab">Proyectos adjudicados ${INV_YEARS[0]}–${closedY}</div><div class="val">${fmtInt(grandTotal)}</div>
        <div class="delta flat">Todas las fuentes de financiamiento</div>
      </div>
      <div class="kpi" data-idx="inv2"><div class="lab">Proyectos adjudicados ${closedY}</div><div class="val">${fmtInt(inv.total[String(closedY)])}</div>
        ${deltaBadge(yoyDeltaPct({[String(prevY)]: inv.total[String(prevY)], [String(closedY)]: inv.total[String(closedY)]}))}
      </div>
      <div class="kpi" data-idx="inv3"><div class="lab">Fuente principal</div><div class="val" style="font-size:18px;">${escapeHtml(top.nombre)}</div>
        <div class="delta flat">${fmtInt(tipoTotal(top))} proyectos adjudicados en el período</div>
      </div>
      ${hasVig ? `<div class="kpi" data-idx="inv4"><div class="lab">Proyectos vigentes ${closedYVig}</div><div class="val">${fmtInt(vig.total[String(closedYVig)])}</div>
        ${deltaBadge(yoyDeltaPct({[String(prevYVig)]: vig.total[String(prevYVig)], [String(closedYVig)]: vig.total[String(closedYVig)]}))}
        <div class="kpi-note">En ejecución ese año, incluye proyectos adjudicados en años previos</div>
      </div>` : ''}
    </div>

    <div class="section-title"><span class="n">01</span><h3>Proyectos adjudicados por año</h3><div class="line"></div></div>
    <div class="card tall" style="margin-bottom:18px;"><h4>Proyectos adjudicados por tipo y año</h4><div class="note">Cantidad de proyectos nuevos adjudicados ese año, por fuente de financiamiento</div><canvas id="chartInvTipos"></canvas></div>

    <div class="section-title"><span class="n">02</span><h3>Detalle de proyectos adjudicados por tipo</h3><div class="line"></div></div>
    <div class="ledger-wrap"><table class="ledger" id="tblInvTipos"></table></div>

    ${hasVig ? `
    <div class="section-title"><span class="n">03</span><h3>Proyectos vigentes por año</h3><div class="line"></div></div>
    <div class="note" style="margin:-6px 0 14px; font-size:12px;">Proyectos en ejecución cada año (incluye proyectos plurianuales adjudicados en años anteriores), a diferencia de los proyectos adjudicados que solo cuentan los nuevos.</div>
    <div class="card tall" style="margin-bottom:18px;"><h4>Proyectos vigentes por tipo y año</h4><div class="note">Cantidad de proyectos en ejecución, por fuente de financiamiento</div><canvas id="chartInvVigentes"></canvas></div>

    <div class="section-title"><span class="n">04</span><h3>Detalle de proyectos vigentes por tipo</h3><div class="line"></div></div>
    <div class="ledger-wrap"><table class="ledger" id="tblInvVigentes"></table></div>` : ''}
  `;

  buildInvChart(tipos, INV_YEARS);
  buildInvTable(tipos, INV_YEARS, inv.total);
  if(hasVig){
    buildInvChart(vig.tipos, VIG_YEARS, 'chartInvVigentes');
    buildInvTable(vig.tipos, VIG_YEARS, vig.total, 'tblInvVigentes', 'Promedio', true);
  }
}

function buildInvChart(tipos, years, elId){
  elId = elId || 'chartInvTipos';
  const key = elId;
  const ctx = document.getElementById(elId);
  const palette = categoricalPalette(tipos.length);
  charts[key] = new Chart(ctx, {
    type:'bar',
    data:{
      labels: years,
      datasets: tipos.map((t,i)=>({
        label: t.nombre,
        data: years.map(y => t.valores[String(y)] ?? 0),
        backgroundColor: palette[i],
        borderRadius: 3,
        maxBarThickness: 40,
      }))
    },
    options: commonBarOpts({xTitle:'Año', yTitle:'N° de proyectos', stacked:true})
  });
}

function buildInvTable(tipos, years, total, elId, colLabel, isAverage){
  elId = elId || 'tblInvTipos';
  colLabel = colLabel || 'Total';
  const tbl = document.getElementById(elId);
  const rowAgg = t => {
    const vals = Object.values(t.valores);
    const sum = vals.reduce((s,v)=>s+v, 0);
    return isAverage ? (sum / vals.length) : sum;
  };
  const fmtAgg = isAverage ? fmtNum1 : fmtInt;
  let html = `<thead><tr><th>Tipo de Proyecto</th>${years.map(y=>`<th>${y}</th>`).join('')}<th>${colLabel}</th></tr></thead><tbody>`;
  tipos.forEach(t=>{
    html += `<tr><td class="name">${escapeHtml(t.nombre)}</td>${years.map(y=>`<td>${fmtInt(t.valores[String(y)] ?? 0)}</td>`).join('')}<td><strong>${fmtAgg(rowAgg(t))}</strong></td></tr>`;
  });
  const totalVals = years.map(y=>total[String(y)] ?? 0);
  const totalAgg = isAverage ? (totalVals.reduce((s,v)=>s+v,0) / totalVals.length) : totalVals.reduce((s,v)=>s+v,0);
  html += `<tr class="selected-row"><td class="name"><strong>Total</strong></td>${years.map(y=>`<td><strong>${fmtInt(total[String(y)] ?? 0)}</strong></td>`).join('')}<td><strong>${fmtAgg(totalAgg)}</strong></td></tr>`;
  html += '</tbody>';
  tbl.innerHTML = html;
}

/* ---------------- Init ---------------- */
render();


</script>
</body>
</html>
